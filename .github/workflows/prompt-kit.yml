name: Architectural Prompt Kit

on:
  push:
    paths:
      - "**"
      - ".github/workflows/prompt-kit.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/prompt-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test prompt toolkit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite
        run: npm test
